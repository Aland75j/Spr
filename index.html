                </div>

                <div onClick={onLog} 
                  className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform text-center group">
                    <p className="text-4xl shadow-sm rounded-full bg-slate-50 dark:bg-slate-800 w-16 h-16 flex items-center justify-center mb-2 group-hover:rotate-12 transition-transform">ðŸ½ï¸</p>
                    <p className="font-bold text-slate-900 dark:text-white">{txt.quickLog}</p>
                    <p className="text-xs text-juula-500 font-bold">{txt.recentFood}</p>
                </div>
             </div>
          </div>
        );
      }

      function TabStats({ txt, p, c, f, user, logs, getLocalISODate, weightLog }) {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        const lineCanvasRef = useRef(null);
        const lineChartInstance = useRef(null);

        // Build 7-day data
        const last7 = Array.from({length: 7}, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() - (6 - i));
            const dateStr = getLocalISODate(d);
            const dayLogs = logs.filter(l => (l.dateStr || '') === dateStr);
            const cals = dayLogs.reduce((s, l) => s + l.cals, 0);
            const wEntry = weightLog.find(w => w.date === dateStr);
            return { dateStr, cals, weight: wEntry ? wEntry.weight : null, label: d.toLocaleDateString('en-US', {weekday: 'short'}) };
        });

        useEffect(() => {
          if(!canvasRef.current) return;
          if(chartInstance.current) chartInstance.current.destroy();
          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: [txt.p, txt.c, txt.f],
              datasets: [{ data: [p, c, f], backgroundColor: ['#3b82f6', '#fb923c', '#6366f1'], borderRadius: 8 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(150,150,150,0.1)' } }, x: { grid: { display: false } } } }
          });
          return () => { if(chartInstance.current) chartInstance.current.destroy(); }
        }, [p,c,f,txt]);

        useEffect(() => {
          if(!lineCanvasRef.current) return;
          if(lineChartInstance.current) lineChartInstance.current.destroy();
          const ctx = lineCanvasRef.current.getContext('2d');
          lineChartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: last7.map(d => d.label),
              datasets: [
                { label: 'Calories', data: last7.map(d => d.cals), borderColor: '#4CAF50', backgroundColor: 'rgba(76,175,80,0.1)', borderWidth: 2, pointBackgroundColor: '#4CAF50', tension: 0.4, fill: true },
                { label: 'Target', data: last7.map(() => user.tdee), borderColor: 'rgba(100,100,100,0.4)', borderWidth: 1, borderDash: [6, 4], pointRadius: 0, tension: 0 }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(150,150,150,0.1)' } }, x: { grid: { display: false } } } }
          });
          return () => { if(lineChartInstance.current) lineChartInstance.current.destroy(); }
        }, [logs, weightLog]);

        // Weekly report numbers
        const avgCals = Math.round(last7.reduce((s, d) => s + d.cals, 0) / 7);
        const daysHit = last7.filter(d => d.cals >= user.tdee * 0.9).length;
        const bestDay = last7.reduce((best, d) => d.cals > best.cals ? d : best, last7[0]);

        return (
          <div className="animate__animated animate__fadeIn space-y-6 h-full flex flex-col">
            <h2 className="text-2xl font-black">{txt.stats}</h2>

            {/* 7-Day Line Chart */}
            <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 relative" style={{height: '220px'}}>
               <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-3">7-Day Calorie Trend</h3>
               <div className="absolute inset-0 mt-14 p-4">
                 <canvas ref={lineCanvasRef}></canvas>
               </div>
            </div>
            
            {/* Quick 7-day stats row */}
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/60 dark:border-slate-800/60 text-center">
                <p className="text-2xl font-black text-juula-500">{avgCals}</p>
                <p className="text-[10px] text-slate-500 font-bold uppercase">{txt.avgCals || 'Avg/Day'}</p>
              </div>
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/60 dark:border-slate-800/60 text-center">
                <p className="text-2xl font-black text-blue-500">{daysHit}/7</p>
                <p className="text-[10px] text-slate-500 font-bold uppercase">Days On Target</p>
              </div>
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/60 dark:border-slate-800/60 text-center">
                <p className="text-2xl font-black text-orange-500">{bestDay ? bestDay.label : '-'}</p>
                <p className="text-[10px] text-slate-500 font-bold uppercase">{txt.bestDay || 'Best Day'}</p>
              </div>
            </div>

            {/* Macro Bar Chart */}
            <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 relative" style={{height: '200px'}}>
               <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-2">{txt.macroDist}</h3>
               <div className="absolute inset-0 mt-12 p-6">
                 <canvas ref={canvasRef}></canvas>
               </div>
            </div>

            <div className="grid grid-cols-2 gap-4 h-32">
               <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col justify-center">
                  <p className="text-xs text-slate-400 font-bold uppercase">{txt.target}</p>
                  <p className="text-2xl font-black text-slate-900 dark:text-white">{user.tdee} <span className="text-sm font-normal text-slate-500">kcal</span></p>
               </div>
               <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col justify-center">
                  <p className="text-xs text-slate-400 font-bold uppercase">{txt.bmi}</p>
                  <p className="text-2xl font-black text-slate-900 dark:text-white">{user.bmi}</p>
               </div>
            </div>
          </div>
        );
      }

      function TabSettings({ txt, user, lang, setLang, isDark, setIsDark, onReset, profiles, setProfiles, logs, water, setUser, setLogs, setWater }) {
        const saveCurrentProfile = () => {
            const updated = (profiles||[]).filter(pr => pr.user.name !== user.name);
            setProfiles([...updated, { user, logs, water }]);
        };
        const switchProfile = (pr) => {
            saveCurrentProfile();
            setUser(pr.user);
            setLogs(pr.logs || []);
            setWater(pr.water || 0);
        };
        return (
          <div className="animate__animated animate__fadeIn space-y-4">
             <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 text-center flex flex-col items-center">
                <div className="w-24 h-24 bg-juula-50 dark:bg-juula-900/30 text-juula-600 rounded-[2rem] flex items-center justify-center text-4xl mb-4 font-black shadow-sm border border-juula-100 dark:border-juula-900/50">
                   {user.name.charAt(0).toUpperCase()}
                </div>
                <h2 className="text-2xl font-black">{user.name}</h2>
                <p className="text-slate-500 font-medium">{user.weight}kg â€¢ {user.height}cm â€¢ {user.age}yr â€¢ {(user.gender).toUpperCase()}</p>
             </div>

             {/* V6: Family Profiles */}
             {profiles && profiles.length > 0 && (
               <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60">
                 <h3 className="font-black text-slate-800 dark:text-white mb-4">Family Profiles</h3>
                 <div className="flex flex-wrap gap-2">{(profiles||[]).map(pr => <button key={pr.user.name} onClick={() => switchProfile(pr)} className="px-4 py-2 bg-juula-50 dark:bg-juula-900/20 text-juula-700 dark:text-juula-300 rounded-full font-bold text-sm border border-juula-200 dark:border-juula-800 hover:bg-juula-100 transition-colors">{pr.user.name}</button>)}</div>
                 <p className="text-[10px] text-slate-400 mt-3">Tap to switch. Your session auto-saves.</p>
               </div>
             )}

             <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 space-y-6">
                <div className="flex justify-between items-center">
                   <div className="font-bold tracking-wide">ðŸŒ {txt.language}</div>
                   <div className="flex bg-slate-100 dark:bg-slate-800 rounded-xl p-1 shadow-inner">
                      {['en', 'ku', 'ar'].map(l => (
                        <button key={l} onClick={()=>setLang(l)} className={`px-4 py-2 text-sm font-bold uppercase rounded-lg transition-all ${lang === l ? 'bg-white dark:bg-slate-700 shadow-sm text-juula-600' : 'text-slate-400'}`}>
                           {l}
                        </button>
                      ))}
                   </div>
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-slate-100 dark:border-slate-800/60">
                   <div className="font-bold tracking-wide">ðŸŒ™ {txt.dark}</div>
                   <button onClick={()=>setIsDark(!isDark)} className={`w-14 h-8 rounded-full transition-colors relative shadow-inner ${isDark ? 'bg-juula-500' : 'bg-slate-200 dark:bg-slate-700'}`}>
                      <div className={`w-6 h-6 bg-white rounded-full absolute top-1 transition-transform shadow-md ${isDark ? 'left-7' : 'left-1'}`}></div>
                   </button>
                </div>
             </div>

             <button onClick={onReset} className="w-full bg-red-50 dark:bg-red-900/10 text-red-500 font-bold p-6 rounded-[2rem] border border-red-100 dark:border-red-900/30 active:scale-95 transition-transform flex items-center justify-center gap-2">
                <i className="fas fa-trash"></i> {txt.reset}
             </button>

             <p className="text-center text-[10px] text-slate-400 font-mono mt-8 tracking-widest opacity-50">JUULA TITAN V6 â€¢ DB: LOADED</p>
          </div>
        );
      }

            // --- V6 RECIPE MODAL ---
      function RecipeModal({ txt, lang, foodDB, onClose, onLog }) {
        const [recipeName, setRecipeName] = React.useState('');
        const [items, setItems] = React.useState([]);
        const [search, setSearch] = React.useState('');
        const filtered = foodDB.filter(f => f.name_en.toLowerCase().includes(search.toLowerCase())).slice(0, 6);
        const totalCals = items.reduce((s, it) => s + Math.round(it.food.cals * it.mult), 0);
        return (
          <div className="fixed inset-0 z-[150] bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center">
            <div className="bg-white dark:bg-slate-900 w-full md:w-[500px] rounded-t-[2rem] md:rounded-[2rem] p-6 max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between mb-4"><h2 className="text-2xl font-black text-purple-600">Recipe Builder</h2><button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold">&times;</button></div>
              <input value={recipeName} onChange={e => setRecipeName(e.target.value)} placeholder="Recipe name..." className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl mb-3 outline-none text-slate-900 dark:text-white" />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search food to add..." className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl mb-2 outline-none text-slate-900 dark:text-white" />
              {search && <div className="mb-3 space-y-1">{filtered.map(f => <button key={f.id} onClick={() => { setItems([...items, {food: f, mult: 1, cat: 'lunch'}]); setSearch(''); }} className="w-full text-left px-4 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl hover:bg-juula-50 transition-colors"><span className="font-bold text-sm">{f.name_en}</span><span className="text-xs text-slate-400 ml-2">{f.cals}kcal</span></button>)}</div>}
              <div className="space-y-2 mb-4">{items.map((it, idx) => <div key={idx} className="flex items-center gap-3 bg-slate-50 dark:bg-slate-800 p-3 rounded-xl"><span className="flex-1 font-semibold text-sm">{it.food.name_en}</span><input type="number" value={it.mult} min="0.1" step="0.1" onChange={e => { const arr=[...items]; arr[idx].mult=parseFloat(e.target.value)||1; setItems(arr); }} className="w-14 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 p-1 rounded-lg text-center text-sm outline-none" /><button onClick={() => setItems(items.filter((_,i) => i!==idx))} className="w-6 h-6 rounded-full bg-red-100 text-red-500 font-bold text-xs">&times;</button></div>)}</div>
              {items.length > 0 && <div className="bg-juula-50 dark:bg-juula-900/20 p-3 rounded-xl mb-4 flex justify-between"><span className="font-bold">{recipeName||'My Recipe'}</span><span className="text-juula-600 font-black">{totalCals} kcal</span></div>}
              <button onClick={() => { if(items.length>0) onLog(items); }} disabled={items.length===0} className="w-full bg-purple-500 hover:bg-purple-600 disabled:bg-slate-300 dark:disabled:bg-slate-700 text-white font-black p-4 rounded-2xl active:scale-95 transition-all">Log Recipe</button>
            </div>
          </div>
        );
      }

      // --- V6 MEAL TEMPLATES MODAL ---
      function MealTemplatesModal({ txt, lang, foodDB, onClose, onApply }) {
        const templates = [
          { name: 'High Protein Day', emoji: '💪', desc: 'Muscle gain: high protein, moderate carbs', items: foodDB.slice(0,4).map((f,i)=>({food:f,mult:[1,0.5,1,1][i]||1,cat:['breakfast','lunch','lunch','dinner'][i]||'snack'})) },
          { name: 'Ramadan Iftar', emoji: '🌙', desc: 'Traditional breaking fast plan', items: foodDB.slice(1,5).map((f,i)=>({food:f,mult:[1,1,0.5,1][i]||1,cat:['snack','dinner','dinner','dinner'][i]||'snack'})) },
          { name: 'Light Detox', emoji: '🥗', desc: 'Low calorie, nutrient-dense', items: foodDB.slice(0,3).map((f,i)=>({food:f,mult:0.5,cat:['breakfast','lunch','dinner'][i]||'dinner'})) },
          { name: 'Eid Feast', emoji: '🎉', desc: 'Celebratory family spread', items: foodDB.slice(2,7).map((f,i)=>({food:f,mult:[1.5,1,1,1,1][i]||1,cat:['lunch','lunch','dinner','dinner','snack'][i]||'lunch'})) },
        ];
        return (
          <div className="fixed inset-0 z-[150] bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center">
            <div className="bg-white dark:bg-slate-900 w-full md:w-[480px] rounded-t-[2rem] md:rounded-[2rem] p-6 max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between mb-4"><h2 className="text-2xl font-black text-amber-600">Meal Templates</h2><button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold">&times;</button></div>
              <div className="space-y-4">{templates.map(t => <div key={t.name} className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/60 dark:border-slate-700"><div className="flex justify-between items-start"><div><p className="font-black">{t.emoji} {t.name}</p><p className="text-xs text-slate-400 mt-1">{t.desc}</p><p className="text-xs text-juula-500 font-bold mt-1">{t.items.reduce((s,it)=>s+Math.round(it.food.cals*it.mult),0)} kcal total</p></div><button onClick={()=>onApply(t.items)} className="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl text-sm active:scale-95">Apply</button></div></div>)}</div>
            </div>
          </div>
        );
      }

      // --- V6 WEEKLY REPORT MODAL ---
      function WeeklyReportModal({ txt, logs, user, weightLog, getLocalISODate, onClose }) {
        const last7 = Array.from({length:7}, (_,i) => {
          const d = new Date(); d.setDate(d.getDate()-(6-i));
          const dateStr = getLocalISODate(d);
          const cals = logs.filter(l=>(l.dateStr||'')===dateStr).reduce((s,l)=>s+l.cals,0);
          return { dateStr, cals, label: d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) };
        });
        const avgCals = Math.round(last7.reduce((s,d)=>s+d.cals,0)/7);
        const daysHit = last7.filter(d=>d.cals>=user.tdee*0.9).length;
        const bestDay = last7.reduce((b,d)=>d.cals>b.cals?d:b,last7[0]);
        return (
          <div className="fixed inset-0 z-[150] bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center">
            <div className="bg-white dark:bg-slate-900 w-full md:w-[480px] rounded-t-[2rem] md:rounded-[2rem] p-6 max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between mb-4"><h2 className="text-2xl font-black">Weekly Report</h2><button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold">&times;</button></div>
              <div className="bg-gradient-to-br from-juula-500 to-juula-600 rounded-2xl p-5 text-white mb-4">
                <p className="font-black text-xl mb-1">On target {daysHit}/7 days this week!</p>
                <p className="text-juula-100 text-sm">Avg: {avgCals} kcal/day vs {user.tdee} kcal goal</p>
                <p className="text-white/80 text-sm mt-1">Best day: {bestDay.label} ({bestDay.cals} kcal)</p>
              </div>
              <div className="space-y-2 mt-4">{last7.map(d=><div key={d.dateStr} className="flex items-center gap-3"><span className="text-xs text-slate-500 w-10">{d.label.split(',')[0]}</span><div className="flex-1 h-3 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div className={`h-full rounded-full ${d.cals>=user.tdee*0.9?'bg-juula-500':'bg-slate-300 dark:bg-slate-600'}`} style={{width:`${Math.min((d.cals/user.tdee)*100,100)}%`}}></div></div><span className="text-xs font-bold w-14 text-right text-slate-700 dark:text-slate-300">{d.cals}</span></div>)}</div>
            </div>
          </div>
        );
      }

      // --- V6 SHARE CARD MODAL ---
      function ShareCardModal({ txt, activeLogs, user, consumed, activeDate, onClose }) {
        return (
          <div className="fixed inset-0 z-[150] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[2rem] overflow-hidden shadow-2xl">
              <div className="bg-gradient-to-br from-juula-500 to-juula-700 p-8 text-white">
                <div className="flex items-center gap-3 mb-6"><div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center font-black text-2xl italic">J</div><div><p className="font-black text-xl">{user.name}</p><p className="text-juula-100 text-xs">{activeDate}</p></div></div>
                <div className="text-center mb-6"><p className="text-6xl font-black">{consumed}</p><p className="text-juula-100 font-bold">kcal consumed</p><p className="text-white/70 text-sm mt-1">of {user.tdee} kcal goal</p></div>
                <div className="grid grid-cols-2 gap-2">{activeLogs.slice(0,4).map(l=><div key={l.logId} className="bg-white/10 rounded-xl p-3"><p className="font-bold text-xs truncate">{l.name_en}</p><p className="text-juula-100 text-xs">{l.cals} kcal</p></div>)}</div>
                <p className="text-center text-[10px] text-white/50 mt-4 font-mono">JUULA TITAN V6</p>
              </div>
              <div className="p-4 flex gap-3">
                <button onClick={() => alert('To share: Take a screenshot of this card!')} className="flex-1 bg-juula-500 text-white font-bold py-3 rounded-xl hover:bg-juula-600 transition-colors">Screenshot tip</button>
                <button onClick={onClose} className="px-4 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold rounded-xl">Close</button>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
