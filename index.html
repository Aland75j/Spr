<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARTAN SHOP | Ultimate Gaming Hub</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #121620;
            --card-bg: rgba(22, 27, 38, 0.85);
            --accent-gold: #d4af37;
            --accent-red: #e63946;
            --accent-glow: rgba(212, 175, 55, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(212, 175, 55, 0.25);
            --glass-bg: rgba(10, 12, 16, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 75%);
        }

        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 6, 8, 0.92);
            backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .intro-content {
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 35px var(--accent-glow);
            padding: 40px;
            border-radius: 20px;
            max-width: 90%;
            width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pulseGlow 3s infinite alternate;
        }

        .spartan-logo-lg {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6));
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .btn-enter {
            margin-top: 25px;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-enter:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
        }

        /* --- HEADER & NAVBAR --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-red);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* --- BROADCAST BANNER --- */
        #broadcast-banner {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), rgba(230, 57, 70, 0.15));
            border-bottom: 1px solid var(--border-color);
            padding: 8px 5%;
            text-align: center;
            font-weight: 600;
            color: var(--accent-gold);
            font-size: 0.95rem;
            display: none;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-gold);
            padding-left: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        .item-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .item-price {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-gold), #b89628);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* --- MODAL BASE --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-btn:hover { color: var(--accent-red); }

        /* --- ITEM DIALOG MODAL --- */
        .item-dialog-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .item-dialog-desc {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin: 15px 0;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-gold);
        }

        /* --- CHECKOUT & PAYMENT --- */
        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .payment-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .payment-btn.paypal { background: #003087; border-color: #0070ba; }
        .payment-btn.paypal:hover { background: #0070ba; }
        .payment-btn.card { background: #2d3748; border-color: #4a5568; }
        .payment-btn.card:hover { background: #4a5568; }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .input-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .input-control:focus {
            border-color: var(--accent-gold);
        }

        /* --- ADMIN MENU --- */
        .admin-tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .admin-tab {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .admin-tab.active {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
        }

        /* --- RESPONSIVE MOBILE FIXES --- */
        @media (max-width: 768px) {
            header { padding: 10px 4%; }
            .brand-title { font-size: 1.4rem; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
            .modal-content { padding: 18px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND YOUTUBE MUSIC CONTROLLER -->
    <iframe id="youtube-audio-player" 
            style="display:none;" 
            width="0" height="0" 
            src="https://www.youtube.com/embed/5FbOfjma3T4?enablejsapi=1&autoplay=1&loop=1&playlist=5FbOfjma3T4" 
            allow="autoplay">
    </iframe>

    <!-- INTRO OVERLAY SCREEN -->
    <div id="intro-overlay">
        <div class="intro-content">
            <img src="https://static.vecteezy.com/system/resources/previews/048/948/754/non_2x/black-and-white-spartan-logo-transparent-background-png.png" alt="Spartan Logo" class="spartan-logo-lg">
            <h1 class="intro-title">SPARTAN SHOP</h1>
            <p style="color: var(--text-muted);">Welcome to the Official Store</p>
            <button class="btn-enter" onclick="enterSite()"><i class="fa-solid fa-shield-halved"></i> ENTER STORE</button>
        </div>
    </div>

    <!-- MAIN HEADER -->
    <header>
        <div class="brand-container">
            <img src="https://static.vecteezy.com/system/resources/previews/048/948/754/non_2x/black-and-white-spartan-logo-transparent-background-png.png" alt="Spartan Logo" class="brand-logo">
            <div class="brand-title">SPARTAN</div>
        </div>

        <div class="nav-controls">
            <button class="icon-btn" title="Toggle Music" onclick="toggleMusic()">
                <i id="music-icon" class="fa-solid fa-volume-high"></i>
            </button>
            <button class="icon-btn" title="Live Chat" onclick="toggleChat()">
                <i class="fa-solid fa-comments"></i>
            </button>
            <button class="icon-btn" title="Cart" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-badge" class="badge">0</span>
            </button>
            <button class="icon-btn" title="Admin Login" onclick="openAdminModal()">
                <i class="fa-solid fa-user-shield"></i>
            </button>
        </div>
    </header>

    <!-- BROADCAST BANNER -->
    <div id="broadcast-banner"></div>

    <!-- STORE CONTAINER -->
    <div class="container">
        <h2 class="section-title">Store Items</h2>
        <div id="items-grid" class="items-grid">
            <!-- Dynamic Items Injected Here -->
        </div>
    </div>

    <!-- ITEM DETAIL DIALOG MODAL -->
    <div id="item-dialog-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('item-dialog-modal')">&times;</span>
            <img id="dialog-item-img" class="item-dialog-img" src="" alt="Item Image">
            <h2 id="dialog-item-name" style="color: var(--accent-gold); margin-bottom: 5px;"></h2>
            <div id="dialog-item-price" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px;"></div>
            <div id="dialog-item-desc" class="item-dialog-desc"></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-primary" style="background: #4a5568; color: #fff;" onclick="closeModal('item-dialog-modal')">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
                <button id="dialog-add-cart-btn" class="btn-primary">
                    <i class="fa-solid fa-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </div>

    <!-- CART & CHECKOUT MODAL -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
            <h2 style="color: var(--accent-gold); margin-bottom: 15px;"><i class="fa-solid fa-cart-shopping"></i> Your Cart</h2>
            
            <div id="cart-items-list" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;">
                <!-- Cart items dynamically listed -->
            </div>

            <div class="input-group">
                <label>Discount Coupon</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="coupon-code" class="input-control" placeholder="Enter coupon...">
                    <button class="btn-primary" style="width: 100px;" onclick="applyCoupon()">Apply</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin: 15px 0; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <span>Total:</span>
                <span id="cart-total-price" style="color: var(--accent-gold);">$0.00</span>
            </div>

            <div class="payment-methods">
                <button class="payment-btn paypal" onclick="processPayment('PayPal')">
                    <i class="fa-brands fa-paypal"></i> Pay with PayPal
                </button>
                <button class="payment-btn card" onclick="openBankCardModal()">
                    <i class="fa-solid fa-credit-card"></i> Pay with Bank Card
                </button>
                <button class="btn-primary" style="background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red);" onclick="clearCart()">
                    Clear Cart
                </button>
            </div>
        </div>
    </div>

    <!-- CARD PAYMENT FORM MODAL -->
    <div id="card-payment-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('card-payment-modal')">&times;</span>
            <h2 style="color: var(--accent-gold); margin-bottom: 15px;"><i class="fa-solid fa-credit-card"></i> Card Payment</h2>
            
            <div class="input-group">
                <label>Cardholder Name</label>
                <input type="text" id="card-name" class="input-control" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label>Card Number</label>
                <input type="text" id="card-number" class="input-control" placeholder="4532 •••• •••• 8890">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Expiry Date</label>
                    <input type="text" id="card-expiry" class="input-control" placeholder="MM/YY">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>CVC</label>
                    <input type="text" id="card-cvc" class="input-control" placeholder="123">
                </div>
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="processPayment('Credit/Debit Card')">
                Confirm & Pay Now
            </button>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="modal">
        <div class="modal-content" style="max-width: 650px;">
            <span class="close-btn" onclick="closeModal('admin-modal')">&times;</span>
            
            <div id="admin-login-sec">
                <h2 style="color: var(--accent-gold); margin-bottom: 15px;"><i class="fa-solid fa-lock"></i> Admin Access</h2>
                <div class="input-group">
                    <label>Admin Secret Key</label>
                    <input type="password" id="admin-pass" class="input-control" placeholder="Enter password...">
                </div>
                <button class="btn-primary" style="width: 100%;" onclick="loginAdmin()">Login</button>
            </div>

            <div id="admin-panel-sec" style="display: none;">
                <h2 style="color: var(--accent-gold); margin-bottom: 15px;"><i class="fa-solid fa-sliders"></i> Admin Control Center</h2>
                
                <div class="admin-tab-container">
                    <div class="admin-tab active" onclick="switchAdminTab('items')">Items</div>
                    <div class="admin-tab" onclick="switchAdminTab('paypal')">PayPal</div>
                    <div class="admin-tab" onclick="switchAdminTab('broadcast')">Broadcast</div>
                </div>

                <!-- ITEMS MANAGEMENT -->
                <div id="admin-tab-items">
                    <h3 style="color: #fff; margin-bottom: 10px;">Add / Update Product</h3>
                    <div class="input-group">
                        <label>Item Name</label>
                        <input type="text" id="admin-item-name" class="input-control">
                    </div>
                    <div class="input-group">
                        <label>Price ($)</label>
                        <input type="number" id="admin-item-price" class="input-control">
                    </div>
                    <div class="input-group">
                        <label>Image URL</label>
                        <input type="text" id="admin-item-img" class="input-control">
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="admin-item-desc" class="input-control" rows="3"></textarea>
                    </div>
                    <button class="btn-primary" style="width: 100%;" onclick="saveAdminItem()">Save Product</button>
                </div>

                <!-- PAYPAL CONFIGURATION -->
                <div id="admin-tab-paypal" style="display: none;">
                    <h3 style="color: #fff; margin-bottom: 10px;">PayPal Integration</h3>
                    <div class="input-group">
                        <label>PayPal Merchant Email / Client ID</label>
                        <input type="text" id="admin-paypal-id" class="input-control" placeholder="sb-xxxx@business.example.com">
                    </div>
                    <button class="btn-primary" style="width: 100%;" onclick="savePayPalSettings()">Connect / Update PayPal</button>
                </div>

                <!-- BROADCAST CONFIGURATION -->
                <div id="admin-tab-broadcast" style="display: none;">
                    <h3 style="color: #fff; margin-bottom: 10px;">Announcement Banner</h3>
                    <div class="input-group">
                        <label>Banner Text</label>
                        <input type="text" id="admin-broadcast-msg" class="input-control" placeholder="Special Discount Today!">
                    </div>
                    <button class="btn-primary" style="width: 100%;" onclick="saveBroadcast()">Update Banner</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceWithYours",
            authDomain: "spartan-shop.firebaseapp.com",
            databaseURL: "https://spartan-shop-default-rtdb.firebaseio.com",
            projectId: "spartan-shop",
            storageBucket: "spartan-shop.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123def456"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- LOCAL APP STATE ---
        let cart = [];
        let isMusicPlaying = true;
        let activeCoupon = null;

        // Default Sample Data (if database empty)
        const sampleProducts = [
            {
                id: "item_1",
                name: "Spartan VIP Pass",
                price: 19.99,
                img: "https://static.vecteezy.com/system/resources/previews/048/948/754/non_2x/black-and-white-spartan-logo-transparent-background-png.png",
                desc: "Unlocks full VIP benefits, custom server access, and priority status."
            },
            {
                id: "item_2",
                name: "Elite Weapon Kit",
                price: 9.99,
                img: "https://static.vecteezy.com/system/resources/previews/048/948/754/non_2x/black-and-white-spartan-logo-transparent-background-png.png",
                desc: "High-tier weapons and starter gear bundle for tactical advantage."
            }
        ];

        // --- CORE APPLICATION LIFECYCLE ---
        window.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            listenToSettings();
        });

        function enterSite() {
            const overlay = document.getElementById('intro-overlay');
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';
            playMusic();
        }

        // --- AUDIO CONTROLLER ---
        function playMusic() {
            const iframe = document.getElementById('youtube-audio-player');
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            isMusicPlaying = true;
            document.getElementById('music-icon').className = 'fa-solid fa-volume-high';
        }

        function toggleMusic() {
            const iframe = document.getElementById('youtube-audio-player');
            const icon = document.getElementById('music-icon');
            
            if (isMusicPlaying) {
                iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                icon.className = 'fa-solid fa-volume-xmark';
                isMusicPlaying = false;
            } else {
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                icon.className = 'fa-solid fa-volume-high';
                isMusicPlaying = true;
            }
        }

        // --- PRODUCTS & DIALOG UI ---
        function loadProducts() {
            const grid = document.getElementById('items-grid');
            db.ref('products').on('value', (snapshot) => {
                const data = snapshot.val();
                grid.innerHTML = '';
                const productList = data ? Object.values(data) : sampleProducts;

                productList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => openItemDialog(item);
                    card.innerHTML = `
                        <img src="${item.img}" class="item-img" alt="${item.name}">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">$${parseFloat(item.price).toFixed(2)}</div>
                        <div class="card-actions">
                            <button class="btn-primary" onclick="event.stopPropagation(); addToCart('${item.id}', '${item.name}', ${item.price})">
                                <i class="fa-solid fa-cart-plus"></i> Add
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function openItemDialog(item) {
            document.getElementById('dialog-item-img').src = item.img;
            document.getElementById('dialog-item-name').innerText = item.name;
            document.getElementById('dialog-item-price').innerText = `$${parseFloat(item.price).toFixed(2)}`;
            document.getElementById('dialog-item-desc').innerText = item.desc || 'No description provided.';
            
            const addBtn = document.getElementById('dialog-add-cart-btn');
            addBtn.onclick = () => {
                addToCart(item.id, item.name, item.price);
                closeModal('item-dialog-modal');
            };

            openModal('item-dialog-modal');
        }

        // --- CART MANAGEMENT ---
        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-badge').innerText = cart.length;
            const cartList = document.getElementById('cart-items-list');
            cartList.innerHTML = '';

            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-between; align-items:center; margin-bottom:8px; background:rgba(255,255,255,0.05); padding:8px; border-radius:6px;';
                row.innerHTML = `
                    <span>${item.name}</span>
                    <div>
                        <span style="color:var(--accent-gold); margin-right:10px;">$${item.price.toFixed(2)}</span>
                        <i class="fa-solid fa-trash" style="color:var(--accent-red); cursor:pointer;" onclick="removeFromCart(${idx})"></i>
                    </div>
                `;
                cartList.appendChild(row);
            });

            if (activeCoupon) {
                total = total * (1 - activeCoupon);
            }

            document.getElementById('cart-total-price').innerText = `$${total.toFixed(2)}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            activeCoupon = null;
            updateCartUI();
        }

        function applyCoupon() {
            const code = document.getElementById('coupon-code').value.trim();
            if (code.toUpperCase() === 'SPARTAN10') {
                activeCoupon = 0.10; // 10% discount
                alert('Coupon Applied: 10% Off!');
            } else {
                alert('Invalid Coupon Code');
            }
            updateCartUI();
        }

        // --- CHECKOUT & PAYMENTS ---
        function processPayment(method) {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            alert(`Processing purchase via ${method}... Payment Successful! Thank you for supporting Spartan Shop.`);
            clearCart();
            closeModal('cart-modal');
            closeModal('card-payment-modal');
        }

        function openBankCardModal() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            closeModal('cart-modal');
            openModal('card-payment-modal');
        }

        // --- ADMIN MENU CONTROL ---
        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'spartan123') {
                document.getElementById('admin-login-sec').style.display = 'none';
                document.getElementById('admin-panel-sec').style.display = 'block';
            } else {
                alert('Incorrect Password!');
            }
        }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('admin-tab-items').style.display = 'none';
            document.getElementById('admin-tab-paypal').style.display = 'none';
            document.getElementById('admin-tab-broadcast').style.display = 'none';

            if (tabName === 'items') {
                document.getElementById('admin-tab-items').style.display = 'block';
            } else if (tabName === 'paypal') {
                document.getElementById('admin-tab-paypal').style.display = 'block';
            } else if (tabName === 'broadcast') {
                document.getElementById('admin-tab-broadcast').style.display = 'block';
            }
            event.target.classList.add('active');
        }

        function saveAdminItem() {
            const name = document.getElementById('admin-item-name').value;
            const price = parseFloat(document.getElementById('admin-item-price').value);
            const img = document.getElementById('admin-item-img').value;
            const desc = document.getElementById('admin-item-desc').value;

            if (!name || isNaN(price)) {
                alert('Please provide valid name and price');
                return;
            }

            const itemId = 'item_' + Date.now();
            db.ref('products/' + itemId).set({
                id: itemId,
                name: name,
                price: price,
                img: img || 'https://static.vecteezy.com/system/resources/previews/048/948/754/non_2x/black-and-white-spartan-logo-transparent-background-png.png',
                desc: desc
            }).then(() => {
                alert('Product Saved Successfully!');
                document.getElementById('admin-item-name').value = '';
                document.getElementById('admin-item-price').value = '';
                document.getElementById('admin-item-img').value = '';
                document.getElementById('admin-item-desc').value = '';
            });
        }

        function savePayPalSettings() {
            const paypalId = document.getElementById('admin-paypal-id').value;
            db.ref('settings/paypal_id').set(paypalId).then(() => {
                alert('PayPal Connection Settings Updated Successfully!');
            });
        }

        function saveBroadcast() {
            const msg = document.getElementById('admin-broadcast-msg').value;
            db.ref('settings/broadcast').set(msg).then(() => {
                alert('Broadcast Banner Updated!');
            });
        }

        function listenToSettings() {
            db.ref('settings').on('value', (snapshot) => {
                const settings = snapshot.val() || {};
                
                // PayPal ID
                if (settings.paypal_id) {
                    document.getElementById('admin-paypal-id').value = settings.paypal_id;
                }

                // Broadcast Banner
                const banner = document.getElementById('broadcast-banner');
                if (settings.broadcast) {
                    banner.innerText = settings.broadcast;
                    banner.style.display = 'block';
                } else {
                    banner.style.display = 'none';
                }
            });
        }

        // --- UTILITY MODAL HELPERS ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openCartModal() { updateCartUI(); openModal('cart-modal'); }
        function openAdminModal() { openModal('admin-modal'); }
        function toggleChat() { alert('Live support chat initialized. An admin will respond shortly.'); }
    </script>
</body>
</html>
