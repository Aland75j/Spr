      // --- APP COMPONENT ---
      function App() {
        const [lang, setLang] = useState('en');
        const [isDark, setIsDark] = useState(false);
        const [user, setUser] = useState(null); 
        const [activeTab, setActiveTab] = useState('home');
        const [logs, setLogs] = useState([]);
        const [water, setWater] = useState(0);
        const [showAdmin, setShowAdmin] = useState(false);
        const [splashEnd, setSplashEnd] = useState(false);
        const [foodDB, setFoodDB] = useState(DEFAULT_DB);
        const [selectedFood, setSelectedFood] = useState(null);
        const [appTitle, setAppTitle] = useState(null);
        const [scannerMode, setScannerMode] = useState(null);
        const [weightLog, setWeightLog] = useState([]); // [{date, weight}]
        const [profiles, setProfiles] = useState([]); // [{user, logs, water}]
        const [barcodeCache, setBarcodeCache] = useState({}); // {barcode: foodObj}
        const [showRecipe, setShowRecipe] = useState(false);
        const [showMealTemplates, setShowMealTemplates] = useState(false);
        const [showWeeklyReport, setShowWeeklyReport] = useState(false);
        const [showShareCard, setShowShareCard] = useState(false);

        const getLocalISODate = (d = new Date()) => {
          const t = new Date(d);
          t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
          return t.toISOString().split('T')[0];
        };
        const [activeDate, setActiveDate] = useState(() => getLocalISODate());

        const dir = (lang === 'ku' || lang === 'ar') ? 'rtl' : 'ltr';
        const txt = T[lang];

        // STARTUP
        useEffect(() => {
          setTimeout(() => setSplashEnd(true), 2500); // 2.5s splash
          
          const savedUser = localStorage.getItem('juula_user');
          if (savedUser) setUser(JSON.parse(savedUser));
          const savedLogs = localStorage.getItem('juula_logs');
          if (savedLogs) setLogs(JSON.parse(savedLogs));
          const savedLang = localStorage.getItem('juula_lang');
          if (savedLang) setLang(savedLang);
          const savedDark = localStorage.getItem('juula_dark');
          if (savedDark === 'true') setIsDark(true);
          const savedDB = localStorage.getItem('juula_food_db');
          if (savedDB) setFoodDB(JSON.parse(savedDB));
          const savedTitle = localStorage.getItem('juula_title');
          if (savedTitle) setAppTitle(savedTitle);
          const savedWeightLog = localStorage.getItem('juula_weight_log');
          if (savedWeightLog) setWeightLog(JSON.parse(savedWeightLog));
          const savedProfiles = localStorage.getItem('juula_profiles');
          if (savedProfiles) setProfiles(JSON.parse(savedProfiles));
          const savedBarcodeCache = localStorage.getItem('juula_barcode_cache');
          if (savedBarcodeCache) setBarcodeCache(JSON.parse(savedBarcodeCache));
        }, []);

        // PERSISTENCE
        useEffect(() => {
          document.documentElement.dir = dir;
          document.documentElement.lang = lang;
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          localStorage.setItem('juula_dark', isDark);
          localStorage.setItem('juula_lang', lang);
          if (user) localStorage.setItem('juula_user', JSON.stringify(user));
          localStorage.setItem('juula_logs', JSON.stringify(logs));
          localStorage.setItem('juula_food_db', JSON.stringify(foodDB));
          if (appTitle) localStorage.setItem('juula_title', appTitle);
          localStorage.setItem('juula_weight_log', JSON.stringify(weightLog));
          localStorage.setItem('juula_profiles', JSON.stringify(profiles));
          localStorage.setItem('juula_barcode_cache', JSON.stringify(barcodeCache));
        }, [user, logs, lang, isDark, dir, foodDB, appTitle, weightLog, profiles, barcodeCache]);

        // ADMIN OVERLORD (Keyboard listener)
        useEffect(() => {
          const handleKey = (e) => {
            if (e.key === 'End') {
              const pass = prompt("ADMIN CODE:");
              if (pass === "1") setShowAdmin(true);
            }
          };
          window.addEventListener('keydown', handleKey);
          return () => window.removeEventListener('keydown', handleKey);
        }, []);

        // SPLASH SCREEN
        if (!splashEnd) {
          return (
            <div className={`fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-juula-500 text-white ${splashEnd ? 'animate-splash-fade' : ''}`}>
               <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center text-juula-500 font-black italic text-5xl shadow-2xl animate-bounce-slow mb-8">J</div>
               <h1 className="text-4xl font-black tracking-tight mb-2">{appTitle ? appTitle.toUpperCase() : 'JUULA'} <span className="opacity-80">ELITE</span></h1>
               <p className="text-sm font-bold tracking-widest uppercase opacity-70 mb-12">{txt.subtitle}</p>
               <div className="w-48 h-1 bg-white/20 rounded-full overflow-hidden">
                  <div className="h-full bg-white animate-[pulse_1.5s_infinite] w-1/2 rounded-full"></div>
               </div>
            </div>
          );
        }

        // AUTH / ONBOARDING
        if (!user) {
          return <AuthScreen txt={txt} lang={lang} setLang={setLang} onLogin={(u) => setUser(u)} isDark={isDark} setIsDark={setIsDark} appTitle={appTitle} />;
        }

        const activeLogs = logs.filter(l => (l.dateStr || getLocalISODate(new Date(l.logId))) === activeDate);
        const consumed = activeLogs.reduce((sum, item) => sum + item.cals, 0);
        const p = activeLogs.reduce((sum, item) => sum + item.p, 0);
        const c = activeLogs.reduce((sum, item) => sum + item.c, 0);
        const f = activeLogs.reduce((sum, item) => sum + item.f, 0);
        const remaining = Math.max(0, user.tdee - consumed);

        const handleLogFood = (food, multiplier, category) => {
            setLogs([...logs, {
                ...food, 
                logId: Date.now(), 
                multiplier: multiplier,
                category: category || 'snack',
                dateStr: activeDate,
                cals: Math.round(food.cals * multiplier),
                p: Math.round(food.p * multiplier),
                c: Math.round(food.c * multiplier),
                f: Math.round(food.f * multiplier),
            }]);
            setSelectedFood(null);
            if (navigator.vibrate) navigator.vibrate(60); // Haptic
        };

        // Streak computation
        const computeStreak = () => {
            let streak = 0;
            let d = new Date();
            while (true) {
                const dateStr = getLocalISODate(d);
                const hasLog = logs.some(l => (l.dateStr || '') === dateStr);
                if (!hasLog) break;
                streak++;
                d.setDate(d.getDate() - 1);
            }
            return streak;
        };
        const streak = computeStreak();

        // Smart suggestions
        const getSmartTip = () => {
            if (remaining > 600) return 'You have ' + remaining + ' kcal remaining — try a high-protein meal! 💪';
            if (remaining > 200) return 'Almost at target! A light snack will round off your day 🍎';
            if (remaining <= 0) return 'You hit your calorie target today! 🎯 Great job!';
            return 'Keep logging your meals to stay on track!';
        };

        const renderTab = () => {
          switch(activeTab) {
            case 'home': return <TabHome txt={txt} user={user} consumed={consumed} remaining={remaining} p={p} c={c} f={f} lang={lang} logs={activeLogs} onDeleteLog={(id) => setLogs(logs.filter(x => x.logId !== id))} activeDate={activeDate} setActiveDate={setActiveDate} getLocalISODate={getLocalISODate} streak={streak} smartTip={getSmartTip()} weightLog={weightLog} setWeightLog={setWeightLog} allLogs={logs} onSetShowWeeklyReport={() => setShowWeeklyReport(true)} onSetShowShareCard={() => setShowShareCard(true)} />;
            case 'food': return <TabFood txt={txt} lang={lang} foodDB={foodDB} onSelect={(f) => setSelectedFood(f)} />;
            case 'add': return <TabAdd txt={txt} water={water} setWater={setWater} lang={lang} onLog={() => setSelectedFood(foodDB[0])} setScannerMode={setScannerMode} setShowRecipe={setShowRecipe} setShowMealTemplates={setShowMealTemplates} foodDB={foodDB} />;
            case 'stats': return <TabStats txt={txt} p={p} c={c} f={f} user={user} logs={logs} getLocalISODate={getLocalISODate} weightLog={weightLog} />;
            case 'settings': return <TabSettings txt={txt} user={user} lang={lang} setLang={setLang} isDark={isDark} setIsDark={setIsDark} profiles={profiles} setProfiles={setProfiles} logs={logs} water={water} setUser={setUser} setLogs={setLogs} setWater={setWater} onReset={() => {
              if(confirm(txt.reset + "?")) { setUser(null); setLogs([]); setWater(0); localStorage.clear(); }
            }} />;
          }
        };

        return (
          <div className="flex h-screen bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-500 relative" dir={dir}>

            {/* RECIPE MODAL */}
            {showRecipe && <RecipeModal txt={txt} lang={lang} foodDB={foodDB} onClose={() => setShowRecipe(false)} onLog={(recipe) => { recipe.forEach(r => handleLogFood(r.food, r.mult, r.cat)); setShowRecipe(false); }} />}

            {/* MEAL TEMPLATES MODAL */}
            {showMealTemplates && <MealTemplatesModal txt={txt} lang={lang} foodDB={foodDB} onClose={() => setShowMealTemplates(false)} onApply={(items) => { items.forEach(r => handleLogFood(r.food, r.mult, r.cat)); setShowMealTemplates(false); }} />}

            {/* WEEKLY REPORT MODAL */}
            {showWeeklyReport && <WeeklyReportModal txt={txt} logs={logs} user={user} weightLog={weightLog} getLocalISODate={getLocalISODate} onClose={() => setShowWeeklyReport(false)} />}

            {/* SHARE CARD MODAL */}
            {showShareCard && <ShareCardModal txt={txt} activeLogs={activeLogs} user={user} consumed={consumed} activeDate={activeDate} onClose={() => setShowShareCard(false)} />}
            
            {/* SCANNER MODAL */}
            {scannerMode && (
              <ScannerModal 
                mode={scannerMode} txt={txt} lang={lang} foodDB={foodDB}
                onClose={() => setScannerMode(null)} 
                onResult={(f) => { setScannerMode(null); setSelectedFood({...f, isScanned: true}); }} 
              />
            )}
            
            {/* PORTION SELECTION MODAL */}
            {selectedFood && (
              <div className="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-end md:items-center justify-center animate__animated animate__fadeIn">
                 <PortionModal txt={txt} food={selectedFood} lang={lang} onClose={() => setSelectedFood(null)} onConfirm={handleLogFood} />
              </div>
            )}

            {/* ADMIN CRUD MODAL */}
            {showAdmin && (
              <AdminPanel 
                 foodDB={foodDB} setFoodDB={setFoodDB} 
                 logs={logs} setLogs={setLogs}
                 user={user} setUser={setUser}
                 appTitle={appTitle} setAppTitle={setAppTitle}
                 onClose={() => setShowAdmin(false)} 
              />
            )}

            {/* PC SIDEBAR NAV */}
            <nav className="hidden md:flex flex-col w-24 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 py-8 items-center justify-between z-40 shadow-xl">
              <div className="flex flex-col gap-12 text-slate-400 dark:text-slate-500">
                <div className="w-12 h-12 bg-juula-500 rounded-xl flex items-center justify-center text-white font-black italic shadow-lg shadow-juula-500/30 mb-8">J</div>
                <NavItem icon={<Icons.Home />} label={txt.home} active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                <NavItem icon={<Icons.Search />} label={txt.food} active={activeTab === 'food'} onClick={() => setActiveTab('food')} />
                <button onClick={() => setActiveTab('add')} className={`w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl hover:scale-105 active:scale-95 transition-all ${activeTab==='add' ? 'bg-juula-600' : 'bg-juula-500'}`}>
                    <Icons.Plus />
                </button>
                <NavItem icon={<Icons.Chart />} label={txt.stats} active={activeTab === 'stats'} onClick={() => setActiveTab('stats')} />
                <NavItem icon={<Icons.User />} label={txt.settings} active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
              </div>
            </nav>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 flex flex-col h-full relative overflow-hidden">
              <div className="flex-1 overflow-y-auto w-full max-w-5xl mx-auto pb-24 md:pb-8 p-4 md:p-8 custom-scrollbar relative">
                {renderTab()}
              </div>
            </main>

            {/* MOBILE BOTTOM NAV */}
            <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 flex justify-around items-center h-20 px-2 pb-safe z-40 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] dark:shadow-none">
                <NavItem icon={<Icons.Home />} label={txt.home} active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                <NavItem icon={<Icons.Search />} label={txt.food} active={activeTab === 'food'} onClick={() => setActiveTab('food')} />
                
                <div className="relative -top-6">
                    <button onClick={() => setActiveTab('add')} className={`w-14 h-14 rounded-[1.25rem] flex items-center justify-center text-white shadow-lg shadow-juula-500/40 transform active:scale-90 transition-all ${activeTab==='add' ? 'bg-juula-600 rotate-45' : 'bg-juula-500'}`}>
                        <div className={`${activeTab==='add' ? '-rotate-45' : ''} transition-transform`}><Icons.Plus /></div>
                    </button>
                </div>

                <NavItem icon={<Icons.Chart />} label={txt.stats} active={activeTab === 'stats'} onClick={() => setActiveTab('stats')} />
                <NavItem icon={<Icons.User />} label={txt.settings} active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
            </nav>
          </div>
        );
      }

      // --- SUB COMPONENTS ---
      const NavItem = ({ icon, label, active, onClick }) => (
        <button onClick={onClick} className={`flex flex-col items-center gap-1 transition-all ${active ? 'text-juula-500 translate-y-[-2px]' : 'text-slate-400 hover:opacity-80'}`}>
          <div className={`${active ? 'drop-shadow-[0_0_8px_rgba(76,175,80,0.4)]' : ''}`}>{icon}</div>
          <span className="text-[10px] font-bold tracking-wide">{label}</span>
        </button>
      );

      // --- PORTION SELECTION & EDIT MODAL ---
      function PortionModal({ txt, food, lang, onClose, onConfirm }) {
        const [multiplier, setMultiplier] = useState(1);
        const [category, setCategory] = useState('breakfast');
        
        // Editable State for Scanned items
        const isScanned = !!food.isScanned;
        const [editName, setEditName] = useState((lang==='ku' && food.name_ku) ? food.name_ku : (lang==='ar' && food.name_ar) ? food.name_ar : food.name_en);
        const [editCals, setEditCals] = useState(food.cals);
        const [editP, setEditP] = useState(food.p);
        const [editC, setEditC] = useState(food.c);
        const [editF, setEditF] = useState(food.f);

        const tUnit = food[`unit_${lang}`] || food.unit;

        const presets = [
            { label: `0.5 ${tUnit}`, mult: 0.5 },
            { label: `1 ${tUnit}`, mult: 1 },
            { label: `1.5 ${tUnit}`, mult: 1.5 },
            { label: `2 ${tUnit}`, mult: 2 },
        ];

        return (
            <div className="bg-white dark:bg-slate-900 w-full md:w-[450px] rounded-t-[2rem] md:rounded-[2rem] p-6 shadow-2xl animate__animated animate__slideInUp md:animate__zoomIn max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start mb-6">
                    <div className="w-full mr-4">
                        {isScanned ? (
                           <input value={editName} onChange={e => setEditName(e.target.value)} className="w-full text-2xl font-black bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white p-2 rounded-lg outline-none focus:border-juula-500 border border-transparent" />
                        ) : (
                           <h2 className="text-2xl font-black text-slate-900 dark:text-white">{editName}</h2>
                        )}
                        <p className="text-sm font-bold text-slate-500">{txt.baseUnit}: 1 {tUnit}</p>
                    </div>
                    <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 font-bold flex-shrink-0">&times;</button>
                </div>

                {/* Quick Presets */}
                <div className="grid grid-cols-4 gap-2 mb-6">
                    {presets.map(p => (
                        <button key={p.mult} onClick={() => setMultiplier(p.mult)} 
                            className={`py-3 rounded-xl text-xs font-bold transition-colors ${multiplier === p.mult ? 'bg-juula-500 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}>
                            {p.label}
                        </button>
                    ))}
                </div>

                {/* Custom Slider */}
                <div className="mb-6">
                    <p className="text-xs font-bold text-slate-500 mb-2 uppercase">{txt.customQty}: {multiplier}x</p>
                    <input type="range" min="0.1" max="5" step="0.1" value={multiplier} onChange={e => setMultiplier(parseFloat(e.target.value))} className="w-full accent-juula-500 h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer"/>
                </div>

                {/* Category Selection */}
                <div className="mb-6 grid grid-cols-4 gap-2">
                    {['breakfast', 'lunch', 'dinner', 'snack'].map(cat => (
                        <button key={cat} onClick={() => setCategory(cat)} 
                            className={`py-2 rounded-xl text-[10px] uppercase font-bold transition-colors ${category === cat ? 'bg-indigo-500 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}>
                            {txt[cat]}
                        </button>
                    ))}
                </div>

                {/* Dynamic Calculated Output */}
                <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl mb-6">
                    {isScanned ? (
                       <div className="grid grid-cols-4 gap-2">
                          <div><label className="text-[10px] text-juula-500 font-bold block mb-1">KCAL</label><input type="number" value={editCals} onChange={e => setEditCals(Number(e.target.value))} className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2 rounded text-juula-500 font-black outline-none" /></div>
                          <div><label className="text-[10px] text-blue-500 font-bold block mb-1">{txt.p}</label><input type="number" value={editP} onChange={e => setEditP(Number(e.target.value))} className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2 rounded text-blue-500 font-bold outline-none" /></div>
                          <div><label className="text-[10px] text-orange-400 font-bold block mb-1">{txt.c}</label><input type="number" value={editC} onChange={e => setEditC(Number(e.target.value))} className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2 rounded text-orange-400 font-bold outline-none" /></div>
                          <div><label className="text-[10px] text-indigo-500 font-bold block mb-1">{txt.f}</label><input type="number" value={editF} onChange={e => setEditF(Number(e.target.value))} className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2 rounded text-indigo-500 font-bold outline-none" /></div>
                       </div>
                    ) : (
                       <React.Fragment>
                         <p className="text-3xl font-black text-juula-500 mb-2">{Math.round(editCals * multiplier)} <span className="text-sm text-slate-500 font-bold">KCAL</span></p>
                         <div className="flex justify-between text-xs font-bold">
                             <span className="text-blue-500">{txt.p}: {Math.round(editP * multiplier)}g</span>
                             <span className="text-orange-400">{txt.c}: {Math.round(editC * multiplier)}g</span>
                             <span className="text-indigo-500">{txt.f}: {Math.round(editF * multiplier)}g</span>
                         </div>
                       </React.Fragment>
                    )}
                    {isScanned && <p className="text-[10px] text-slate-400 mt-2 text-center text-juula-500">* Results multiplied by {multiplier}x on Confirm.</p>}
                </div>

                <button onClick={() => onConfirm({...food, name_en: editName, cals: editCals, p: editP, c: editC, f: editF}, multiplier, category)} className="w-full bg-juula-500 hover:bg-juula-600 text-white font-black p-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
                    {txt.confirmScan || txt.confirmLog}
                </button>
            </div>
        )
      }

      // --- NEW: V5 SCANNER MODAL ---
      function ScannerModal({ mode, txt, lang, foodDB, onClose, onResult }) {
          const [status, setStatus] = useState('initializing');
          const [stream, setStream] = useState(null);
          const videoRef = useRef(null);
          
          useEffect(() => {
              if (mode === 'ai') {
                  // Simulate AI Camera Flow
                  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                      .then(s => {
                          setStream(s);
                          if(videoRef.current) videoRef.current.srcObject = s;
                          setStatus('scanning');
                          // AI Simulation mock delay
                          setTimeout(() => {
                              setStatus('analyzing');
                              setTimeout(() => {
                                  // Pick a mock food from DB that visually makes sense or random
                                  const mockMatch = foodDB[Math.floor(Math.random() * foodDB.length)];
                                  s.getTracks().forEach(track => track.stop()); // kill stream
                                  onResult(mockMatch);
                              }, 2000);
                          }, 3000);
                      })
                      .catch(err => {
                          alert("Camera Error: " + err.message);
                          onClose();
                      });
              } else if (mode === 'barcode') {
                  // Dynamically load html5-qrcode if not already loaded
                  const loadAndScan = () => {
                      setStatus('scanning');
                      if (typeof Html5Qrcode === 'undefined') {
                          const script = document.createElement('script');
                          script.src = 'https://unpkg.com/html5-qrcode';
                          script.onload = () => startBarcodeScanner();
                          script.onerror = () => { alert('Barcode library failed to load. Check internet connection.'); onClose(); };
                          document.head.appendChild(script);
                      } else {
                          startBarcodeScanner();
                      }
                  };
                  const startBarcodeScanner = () => {
                  const html5QrcodeScanner = new Html5Qrcode("reader");
                  html5QrcodeScanner.start(
                      { facingMode: "environment" },
                      { fps: 10, qrbox: { width: 250, height: 250 } },
                      (decodedText) => {
                          html5QrcodeScanner.stop();
                          setStatus('analyzing');
                          // Fetch OpenFoodFacts
                          fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`)
                              .then(res => res.json())
                              .then(data => {
                                  if (data.status === 1) {
                                      const prod = data.product;
                                      const mappedFood = {
                                          id: Date.now(),
                                          name_en: prod.product_name_en || prod.product_name || "Unknown Product",
                                          cals: Math.round((prod.nutriments && prod.nutriments['energy-kcal_100g']) || 0),
                                          p: Math.round((prod.nutriments && prod.nutriments['proteins_100g']) || 0),
                                          c: Math.round((prod.nutriments && prod.nutriments['carbohydrates_100g']) || 0),
                                          f: Math.round((prod.nutriments && prod.nutriments['fat_100g']) || 0),
                                          unit: "100g serving"
                                      };
                                      onResult(mappedFood);
                                  } else {
                                      alert("Barcode product not found in OpenFoodFacts database.");
                                      onClose();
                                  }
                              })
                              .catch(err => {
                                  alert("API Error: " + err.message);
                                  onClose();
                              });
                      },
                      () => { /* Ignore read errors quietly */ }
                  ).catch(err => {
                      alert("Scanner Error: " + err.message);
                      onClose();
                  });
                  return () => {
                      if(html5QrcodeScanner.isScanning) html5QrcodeScanner.stop();
                  };
                  }; // end startBarcodeScanner
                  loadAndScan();
                  return; // cleanup handled inside startBarcodeScanner
              }
              
              return () => {
                  if(stream) stream.getTracks().forEach(track => track.stop());
              }
          }, [mode]);

          return (
              <div className="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center overflow-hidden">
                  {/* Top Bar */}
                  <div className="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-20 bg-gradient-to-b from-black/80 to-transparent">
                      <h2 className="text-white font-black italic">{mode === 'ai' ? txt.scanPlate : txt.scanBarcode}</h2>
                      <button onClick={onClose} className="w-10 h-10 bg-white/10 rounded-full text-white font-bold">&times;</button>
                  </div>
                  
                  {/* Camera Viewport */}
                  <div className="relative w-full h-full max-w-md bg-zinc-900 border-x border-zinc-700">
                      {mode === 'ai' && <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />}
                      {mode === 'barcode' && <div id="reader" className="w-full h-full object-cover flex items-center justify-center"></div>}
                      
                      {/* Scanning Overlays */}
                      <div className="absolute inset-0 pointer-events-none">
                          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 border-2 border-juula-500/50 rounded-3xl">
                              <div className="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-juula-500 rounded-tl-3xl"></div>
                              <div className="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-juula-500 rounded-tr-3xl"></div>
                              <div className="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-juula-500 rounded-bl-3xl"></div>
                              <div className="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-juula-500 rounded-br-3xl"></div>
                          </div>
                          {mode === 'ai' && status === 'scanning' && (
                              <div className="w-full h-1 bg-juula-500 absolute top-1/2 shadow-[0_0_20px_#4CAF50] animate-[ping_2s_infinite]"></div>
                          )}
                          {status === 'analyzing' && (
                              <div className="absolute inset-0 bg-juula-500/20 backdrop-blur-md flex flex-col items-center justify-center p-8">
                                  <div className="w-16 h-16 border-4 border-white/20 border-t-juula-500 rounded-full animate-spin mb-4"></div>
                                  <p className="text-white font-black text-xl text-center shadow-lg">{txt.processingAI}</p>
                              </div>
                          )}
                      </div>
                  </div>
                  
                  {/* Instructions */}
                  <div className="absolute bottom-10 left-0 right-0 text-center z-20">
                      <p className="text-white/80 bg-black/60 px-6 py-2 rounded-full inline-block font-bold">
                          {status === 'scanning' ? (mode === 'ai' ? txt.scanDescAI : txt.scanDescBarcode) : txt.productFound}
                      </p>
                  </div>
              </div>
          );
      }

      // --- ADMIN PANEL (V4 Ultimate - Multi Tab) ---
      function AdminPanel({ foodDB, setFoodDB, logs, setLogs, user, setUser, appTitle, setAppTitle, onClose }) {
          const [activeAdminTab, setActiveAdminTab] = useState('db'); // db, system, custom
          const [view, setView] = useState('list'); // list, edit, add
          const [editForm, setEditForm] = useState(null);
          const [customName, setCustomName] = useState(appTitle || '');

          const saveFood = () => {
              if(!editForm.name_en || !editForm.cals) return alert("Required fields missing");
              const safeForm = {
                  ...editForm,
                  cals: parseInt(editForm.cals) || 0,
                  p: parseInt(editForm.p) || 0,
                  c: parseInt(editForm.c) || 0,
                  f: parseInt(editForm.f) || 0,
              };
              
              if(view === 'edit') {
                  setFoodDB(foodDB.map(f => f.id === safeForm.id ? safeForm : f));
              } else {
                  safeForm.id = Date.now();
                  setFoodDB([...foodDB, safeForm]);
              }
              setView('list');
          };

          const deleteFood = (id) => {
              if(confirm("Delete this food entirely?")) {
                  setFoodDB(foodDB.filter(f => f.id !== id));
              }
          };

          const exportData = () => {
              const data = { user, logs, foodDB, appTitle };
              const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `titan_backup_${Date.now()}.json`;
              a.click();
          };

          const importData = (e) => {
              const file = e.target.files[0];
              if(!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                  try {
                      const data = JSON.parse(event.target.result);
                      if(data.user) setUser(data.user);
                      if(data.logs) setLogs(data.logs);
                      if(data.foodDB) setFoodDB(data.foodDB);
                      if(data.appTitle) setAppTitle(data.appTitle);
                      alert("Data imported successfully!");
                  } catch(err) { alert("Invalid backup file."); }
              };
              reader.readAsText(file);
          };

          return (
              <div className="fixed inset-0 z-[9999] bg-slate-900 text-white font-mono p-4 md:p-8 overflow-y-auto">
                 <div className="max-w-4xl mx-auto">
                    <header className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-3xl font-black text-emerald-400">OVERLORD_CMD // v4</h1>
                            <p className="text-sm text-slate-400">System Status: ONLINE | Admin Access</p>
                        </div>
                        <button onClick={onClose} className="px-6 py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold rounded-xl transition-colors">EXIT SESSION</button>
                    </header>

                    {/* Admin Navigation */}
                    <div className="flex gap-2 mb-8 bg-slate-800 p-2 rounded-xl">
                        {['db', 'system', 'custom'].map(t => (
                            <button key={t} onClick={() => { setActiveAdminTab(t); setView('list'); }} 
                                className={`flex-1 py-3 text-sm font-bold uppercase rounded-lg transition-colors ${activeAdminTab === t ? 'bg-emerald-500 text-slate-900' : 'text-slate-400 hover:bg-slate-700'}`}>
                                {t === 'db' ? 'Food Database' : t === 'system' ? 'System Tools' : 'UI Customization'}
                            </button>
                        ))}
                    </div>

                    {/* --- TAB: FOOD DB --- */}
                    {activeAdminTab === 'db' && (
                        <div>
                            {view === 'list' && (
                                <div>
                                    <button onClick={() => { setEditForm({name_en:'', name_ku:'', name_ar:'', cals:0, p:0, c:0, f:0, unit:'Unit'}); setView('add'); }} 
                                        className="mb-6 w-full p-4 border-2 border-dashed border-emerald-500/50 hover:border-emerald-500 text-emerald-400 font-bold hover:bg-emerald-500/10 rounded-xl transition-all">
                                        + ADD NEW FOOD INSTANCE
                                    </button>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {foodDB.map(f => (
                                            <div key={f.id} className="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700">
                                                <div>
                                                    <p className="font-bold text-lg">{f.name_en}</p>
                                                    <p className="text-xs text-slate-400">{f.cals}kcal | P:{f.p} C:{f.c} F:{f.f}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setEditForm(f); setView('edit'); }} className="px-4 py-2 bg-blue-500/20 hover:bg-blue-500/30 text-blue-400 rounded-lg">EDIT</button>
                                                    <button onClick={() => deleteFood(f.id)} className="px-4 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg">DEL</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {(view === 'edit' || view === 'add') && (
                                <div className="bg-slate-800 p-8 rounded-2xl space-y-6 max-w-2xl mx-auto border border-slate-700 shadow-2xl">
                                    <h2 className="text-2xl font-black text-emerald-400 mb-6">{view === 'edit' ? 'MODIFY RESOURCE' : 'CREATE RESOURCE'}</h2>
                                    
                                    <div className="space-y-4">
                                        <div><label className="text-xs text-slate-400 block mb-1">English Name *</label><input value={editForm.name_en} onChange={e=>setEditForm({...editForm, name_en: e.target.value})} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500"/></div>
                                        <div><label className="text-xs text-slate-400 block mb-1">Kurdish Name</label><input value={editForm.name_ku || ''} onChange={e=>setEditForm({...editForm, name_ku: e.target.value})} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500" dir="rtl"/></div>
                                        <div><label className="text-xs text-slate-400 block mb-1">Arabic Name</label><input value={editForm.name_ar || ''} onChange={e=>setEditForm({...editForm, name_ar: e.target.value})} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500" dir="rtl"/></div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs text-emerald-400 block mb-1">Calories (kcal) *</label><input type="number" value={editForm.cals} onChange={e=>setEditForm({...editForm, cals: e.target.value})} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500"/></div>
                                        <div><label className="text-xs text-slate-400 block mb-1">Base Unit (en)</label><input value={editForm.unit} onChange={e=>setEditForm({...editForm, unit: e.target.value})} placeholder="e.g. Plate" className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500"/></div>
                                        <div><label className="text-xs text-slate-400 block mb-1">Base Unit (ku)</label><input value={editForm.unit_ku || ''} onChange={e=>setEditForm({...editForm, unit_ku: e.target.value})} placeholder="e.g. Ù‚Ø§Ù¾" className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500" dir="rtl"/></div>
                                        <div><label className="text-xs text-slate-400 block mb-1">Base Unit (ar)</label><input value={editForm.unit_ar || ''} onChange={e=>setEditForm({...editForm, unit_ar: e.target.value})} placeholder="e.g. ØµØ­Ù†" className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-emerald-500" dir="rtl"/></div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4 p-4 bg-slate-900 rounded-xl border border-slate-700/50 mt-4">
                                        <div><label className="text-xs text-blue-400 block mb-1">Protein (g)</label><input type="number" value={editForm.p} onChange={e=>setEditForm({...editForm, p: e.target.value})} className="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white outline-none"/></div>
                                        <div><label className="text-xs text-orange-400 block mb-1">Carbs (g)</label><input type="number" value={editForm.c} onChange={e=>setEditForm({...editForm, c: e.target.value})} className="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white outline-none"/></div>
                                        <div><label className="text-xs text-indigo-400 block mb-1">Fats (g)</label><input type="number" value={editForm.f} onChange={e=>setEditForm({...editForm, f: e.target.value})} className="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white outline-none"/></div>
                                    </div>

                                    <div className="flex gap-4 pt-6 mt-4 border-t border-slate-700">
                                        <button onClick={saveFood} className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black p-4 rounded-xl transition-colors">SAVE TO DB</button>
                                        <button onClick={() => setView('list')} className="w-1/3 bg-slate-700 hover:bg-slate-600 text-white font-bold p-4 rounded-xl transition-colors">CANCEL</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* --- TAB: SYSTEM TOOLS --- */}
                    {activeAdminTab === 'system' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                <h3 className="text-xl font-bold mb-2 text-blue-400">Data Sync</h3>
                                <p className="text-xs text-slate-400 mb-6">Backup or restore your entire Juula profile, logs, and custom foods via JSON.</p>
                                <div className="space-y-4">
                                    <button onClick={exportData} className="w-full py-4 bg-blue-500/20 hover:bg-blue-500/30 text-blue-400 font-bold rounded-xl border border-blue-500/30 transition-colors">
                                        EXPORT JSON BACKUP
                                    </button>
                                    <label className="block w-full py-4 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold rounded-xl text-center cursor-pointer transition-colors">
                                        IMPORT JSON DATA
                                        <input type="file" accept=".json" onChange={importData} className="hidden" />
                                    </label>
                                </div>
                            </div>
                            
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                <h3 className="text-xl font-bold mb-2 text-red-400">Danger Zone</h3>
                                <p className="text-xs text-slate-400 mb-6">Irreversible database actions. Proceed with caution.</p>
                                <div className="space-y-4">
                                    <button onClick={() => { if(confirm("Clear all diet history?")) setLogs([]); }} className="w-full py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold rounded-xl text-sm border border-red-500/30 text-left px-4">
                                        â–º WIPE DIET LOGS
                                    </button>
                                    <button onClick={() => { if(confirm("Restore default food database? Custom foods will be lost.")) setFoodDB(DEFAULT_DB); }} className="w-full py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold rounded-xl text-sm border border-red-500/30 text-left px-4">
                                        â–º RESET FOOD DB TO DEFAULTS
                                    </button>
                                    <button onClick={() => { if(confirm("Delete User Profile? App will reset to onboarding.")) { setUser(null); onClose(); } }} className="w-full py-3 bg-red-500/10 hover:bg-red-500/20 text-red-500 font-black rounded-xl text-sm border border-red-500/50 text-left px-4">
                                        â–º NUKE USER PROFILE
                                    </button>
                                </div>
                            </div>
                            
                            <div className="col-span-1 md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-700 overflow-x-auto text-[10px] text-green-500/70 py-4 opacity-50 hover:opacity-100 transition-opacity">
                                <p className="mb-2 font-bold text-white">RAW STATE DUMP (READ-ONLY):</p>
                                <pre>{JSON.stringify({ activeLogs: logs.length, dbItems: foodDB.length, profile: (user ? user.name : ""), appTitle }, null, 2)}</pre>
                            </div>
                        </div>
                    )}

                    {/* --- TAB: UI CUSTOMIZATION --- */}
                    {activeAdminTab === 'custom' && (
                        <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 max-w-2xl mx-auto">
                           <h3 className="text-2xl font-black text-indigo-400 mb-2">Interface Overrides</h3>
                           <p className="text-xs text-slate-400 mb-8">Modify the visual text strings globally across the application.</p>
                           
                           <div className="space-y-6">
                               <div>
                                   <label className="text-xs font-bold text-slate-300 block mb-2">App Branding Title</label>
                                   <div className="flex gap-2">
                                       <input value={customName} onChange={e => setCustomName(e.target.value)} placeholder="e.g. MyFitnessApp" className="flex-1 bg-slate-900 border border-slate-700 p-4 rounded-xl text-white outline-none focus:border-indigo-500" />
                                       <button onClick={() => { setAppTitle(customName || null); alert("Branding updated."); }} className="px-6 bg-indigo-500 font-bold rounded-xl text-white hover:bg-indigo-400 transition-colors">APPLY</button>
                                   </div>
                                   <p className="text-[10px] text-slate-500 mt-2">Replaces "Juula" on the splash screen and main authentication headers.</p>
                               </div>
                           </div>
                        </div>
                    )}

                 </div>
              </div>
          );
      }

      // --- ONBOARDING GATEWAY ---
      function AuthScreen({ txt, lang, setLang, onLogin, isDark, setIsDark, appTitle }) {
        const [formData, setForm] = useState({ name: '', weight: '', height: '', age: '', gender: 'male' });

        const calculateBMR = (w, h, a, g) => {
          let bmr = (10 * w) + (6.25 * h) - (5 * a);
          bmr = g === 'male' ? bmr + 5 : bmr - 161;
          return Math.round(bmr * 1.3); 
        };

        const calculateBMI = (w, h) => {
          const hm = h / 100;
          return (w / (hm * hm)).toFixed(1);
        };

        const handleSub = (e) => {
          e.preventDefault();
          const w = parseFloat(formData.weight);
          const h = parseFloat(formData.height);
          const a = parseInt(formData.age);
          if(!w || !h || !a) return;
          const userObj = {
            ...formData,
            bmi: calculateBMI(w, h),
            tdee: calculateBMR(w, h, a, formData.gender)
          };
          onLogin(userObj);
        };

        return (
          <div className={`min-h-screen flex items-center justify-center p-6 ${isDark ? 'bg-slate-950' : 'bg-slate-100'} transition-colors duration-500`} dir={lang === 'en' ? 'ltr' : 'rtl'}>
            <div className={`w-full max-w-md ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} border rounded-[2rem] p-8 shadow-2xl animate__animated animate__fadeInUp`}>
              
              <div className="flex justify-between items-center mb-8">
                <div className="w-12 h-12 bg-juula-500 rounded-xl flex items-center justify-center text-white font-black italic shadow-lg shadow-juula-500/30">J</div>
                <div className="flex gap-2">
                  {['en', 'ku', 'ar'].map(l => (
                    <button key={l} onClick={()=>setLang(l)} className={`px-2 py-1 text-xs rounded-lg font-bold uppercase transition-colors ${lang === l ? 'bg-juula-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>{l}</button>
                  ))}
                  <button onClick={()=>setIsDark(!isDark)} className="p-2 ml-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">
                    {isDark ? 'â˜€ï¸' : 'ðŸŒ™'}
                  </button>
                </div>
              </div>

              <h1 className={`text-4xl font-black mb-2 tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>{appTitle ? appTitle.toUpperCase() : txt.title}</h1>
              <p className="text-slate-500 mb-8 font-medium">{txt.subtitle}</p>

              <form onSubmit={handleSub} className="space-y-4">
                <input required type="text" placeholder={txt.name} className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-juula-500 outline-none w-full text-slate-900 dark:text-white"
                  onChange={e => setForm({...formData, name: e.target.value})} />
                
                <div className="grid grid-cols-2 gap-4">
                  <input required type="number" placeholder={txt.weight} className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-juula-500 outline-none w-full text-slate-900 dark:text-white"
                    onChange={e => setForm({...formData, weight: e.target.value})} />
                  <input required type="number" placeholder={txt.height} className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-juula-500 outline-none w-full text-slate-900 dark:text-white"
                    onChange={e => setForm({...formData, height: e.target.value})} />
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <input required type="number" placeholder={txt.age} className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-juula-500 outline-none w-full text-slate-900 dark:text-white"
                    onChange={e => setForm({...formData, age: e.target.value})} />
                  <select className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 outline-none text-slate-900 dark:text-white"
                    onChange={e => setForm({...formData, gender: e.target.value})}>
                    <option value="male">{txt.male}</option>
                    <option value="female">{txt.female}</option>
                  </select>
                </div>

                <button type="submit" className="w-full bg-juula-500 hover:bg-juula-600 text-white font-bold p-4 rounded-2xl shadow-[0_10px_30px_rgba(76,175,80,0.3)] transition-all active:scale-95 mt-4">
                  {txt.start}
                </button>
              </form>
            </div>
          </div>
        )
      }

      // --- MAIN VIEWS ---
      function TabHome({ txt, user, consumed, remaining, p, c, f, lang, logs, onDeleteLog, activeDate, setActiveDate, getLocalISODate, streak, smartTip, weightLog, setWeightLog, allLogs, onSetShowWeeklyReport, onSetShowShareCard }) {
        const pct = Math.min((consumed / user.tdee) * 100, 100);
        const radius = 60;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (pct / 100) * circumference;
        const [weightInput, setWeightInput] = useState('');

        const changeDate = (days) => {
            const d = new Date(activeDate);
            d.setDate(d.getDate() + days);
            setActiveDate(getLocalISODate(d));
        };

        const logWeight = () => {
            const w = parseFloat(weightInput);
            if (!w) return;
            const today = getLocalISODate();
            const filtered = weightLog.filter(x => x.date !== today);
            setWeightLog([...filtered, { date: today, weight: w }]);
            setWeightInput('');
            if (navigator.vibrate) navigator.vibrate(50);
        };

        return (
          <div className="animate__animated animate__fadeIn space-y-6">
            <header className="flex justify-between items-end mb-2">
              <div>
                <h2 className="text-3xl font-black tracking-tight capitalize">{user.name}</h2>
                <div className="flex items-center gap-4 text-slate-500 font-medium mt-1">
                  <button onClick={() => changeDate(-1)} className="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 flex justify-center items-center hover:bg-juula-500 hover:text-white transition-colors">&lt;</button>
                  <p className="min-w-[120px] text-center">{activeDate === getLocalISODate() ? 'Today' : new Date(activeDate).toLocaleDateString(lang === 'en' ? 'en-US' : 'ar-IQ', { weekday: 'short', month: 'short', day: 'numeric'})}</p>
                  <button onClick={() => changeDate(1)} className="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 flex justify-center items-center hover:bg-juula-500 hover:text-white transition-colors">&gt;</button>
                </div>
              </div>
              <div className="flex flex-col items-end gap-2">
                {streak > 0 && <div className="flex items-center gap-1 bg-orange-100 dark:bg-orange-900/30 text-orange-500 font-black px-3 py-1 rounded-full text-xs">
                  🔥 {streak} {txt.streakDays || 'Day Streak'}
                </div>}
                <div className="flex gap-2">
                  <button onClick={onSetShowShareCard} className="text-xs font-bold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1 rounded-full hover:bg-juula-500 hover:text-white transition-colors">📤 {txt.shareDayLog || 'Share'}</button>
                  <button onClick={onSetShowWeeklyReport} className="text-xs font-bold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1 rounded-full hover:bg-juula-500 hover:text-white transition-colors">📊 {txt.weeklyReport || 'Report'}</button>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {/* HERO RING */}
              <div className="col-span-2 md:col-span-2 bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex items-center justify-between shadow-lg shadow-slate-200/20 dark:shadow-none">
                <div>
                  <p className="text-4xl font-black text-slate-900 dark:text-white mb-1">{remaining}</p>
                  <p className="text-sm font-bold text-slate-500 uppercase tracking-wide">{txt.calsLeft}</p>
                  <div className="mt-6">
                    <p className="text-xs text-slate-400 font-medium mb-1">{txt.target}: {user.tdee} | {txt.consumed}: {consumed}</p>
                  </div>
                </div>
                
                <div className="relative w-32 h-32 flex-shrink-0">
                  <svg className="w-full h-full transform -rotate-90 drop-shadow-sm">
                    <circle cx="64" cy="64" r="60" stroke="currentColor" strokeWidth="8" fill="transparent" className="text-slate-100 dark:text-slate-800" />
                    <circle 
                      className="circle-progress text-juula-500"
                      cx="64" cy="64" r="60" 
                      stroke="currentColor" strokeWidth="8" fill="transparent" strokeLinecap="round"
                      strokeDasharray={circumference}
                      strokeDashoffset={offset}
                    />
                  </svg>
                  <div className="absolute inset-0 flex items-center justify-center">
                    <span className="text-xl font-black text-slate-900 dark:text-white">{Math.round(pct)}%</span>
                  </div>
                </div>
              </div>

              {/* MACROS */}
              <div className="col-span-2 md:col-span-1 bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col justify-between">
                <MacroBar label={txt.p} val={p} max={160} color="bg-blue-500" />
                <MacroBar label={txt.c} val={c} max={250} color="bg-orange-400" />
                <MacroBar label={txt.f} val={f} max={70} color="bg-indigo-500" />
              </div>

              {/* STATS OVERVIEW */}
              <div className="col-span-2 md:col-span-1 bg-gradient-to-br from-juula-500 to-juula-600 text-white rounded-[2rem] p-6 shadow-lg shadow-juula-500/30 flex flex-col justify-between">
                <div>
                  <p className="text-xs font-bold text-juula-100 uppercase tracking-widest">{txt.bmi}</p>
                  <p className="text-4xl font-black mt-1 mb-2 drop-shadow-sm">{user.bmi}</p>
                </div>
                <div className="flex justify-between items-end border-t border-white/20 pt-4 mt-2">
                   <div>
                      <p className="text-[10px] text-juula-100 uppercase">{txt.weight}</p>
                      <p className="font-bold">{user.weight}kg</p>
                   </div>
                   <div className="text-right">
                      <p className="text-[10px] text-juula-100 uppercase">{txt.height}</p>
                      <p className="font-bold">{user.height}cm</p>
                   </div>
                </div>
              </div>
            </div>

             {/* SMART TIP + WEIGHT LOG ROW */}
             <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
               <div className="bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-900/20 dark:to-indigo-900/10 border border-blue-200/60 dark:border-blue-800/30 rounded-2xl p-4 flex items-center gap-3">
                 <span className="text-2xl">💡</span>
                 <p className="text-sm font-semibold text-blue-800 dark:text-blue-200">{smartTip}</p>
               </div>
               <div className="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 rounded-2xl p-4 flex items-center gap-3">
                 <span className="text-xl">⚖️</span>
                 <input type="number" value={weightInput} onChange={e => setWeightInput(e.target.value)} placeholder={txt.weightKg || 'Weight kg'} className="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-xl text-sm outline-none" />
                 <button onClick={logWeight} className="bg-juula-500 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-juula-600 transition-colors active:scale-95">+</button>
               </div>
             </div>

             <div className="mt-4">
                <h3 className="text-xl font-bold mb-4 px-2">{txt.history}</h3>
                <div className="space-y-6">
                  {logs.length === 0 ? (
                    <div className="text-center p-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-[2rem] text-slate-400">
                       {txt.noMeals}
                    </div>
                  ) : ['breakfast', 'lunch', 'dinner', 'snack'].map(cat => {
                    const catLogs = logs.filter(l => l.category === cat);
                    if (catLogs.length === 0) return null;
                    return (
                        <div key={cat} className="space-y-3">
                            <h4 className="text-sm font-bold text-slate-500 uppercase tracking-widest px-2 flex justify-between">
                                <span>{txt[cat]}</span>
                                <span>{catLogs.reduce((sum, l) => sum + l.cals, 0)} KCAL</span>
                            </h4>
                            {catLogs.map(l => (
                                <div key={l.logId} className="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex justify-between items-center group">
                                   <div>
                                      <p className="font-bold text-slate-900 dark:text-white">{(lang==='ku' && l.name_ku) ? l.name_ku : (lang==='ar' && l.name_ar) ? l.name_ar : l.name_en}</p>
                                      <p className="text-xs text-slate-400">{l.multiplier}x {l[`unit_${lang}`] || l.unit}</p>
                                   </div>
                                   <div className="flex items-center gap-4">
                                      <p className="font-black text-juula-500">{l.cals}</p>
                                      <button onClick={() => onDeleteLog(l.logId)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-red-500 transition-colors">
                                         &times;
                                      </button>
                                   </div>
                                </div>
                            )).reverse()}
                        </div>
                    );
                  })}
                </div>
             </div>
          </div>
        );
      }

      function MacroBar({label, val, max, color}) {
        const p = Math.min((val/max)*100, 100);
        return (
          <div className="w-full relative py-2">
             <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-slate-500">{label}</span>
                <span className="text-slate-900 dark:text-white">{val}g</span>
             </div>
             <div className="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                <div className={`h-full ${color} rounded-full transition-all duration-1000 origin-left`} style={{width: `${p}%`}}></div>
             </div>
          </div>
        );
      }

      function TabFood({ txt, lang, foodDB, onSelect }) {
        const [search, setSearch] = useState('');
        
        const filtered = foodDB.filter(f => 
          f.name_en.toLowerCase().includes(search.toLowerCase()) || 
          (f.name_ku && f.name_ku.includes(search)) || 
          (f.name_ar && f.name_ar.includes(search))
        );

        return (

                <input

                  autoFocus
                  placeholder={txt.search} 
                  onChange={(e) => setSearch(e.target.value)}
                  className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:border-juula-500 p-4 px-12 rounded-2xl outline-none shadow-sm text-slate-900 dark:text-white"

      function TabAdd({ txt, water, setWater, lang, onLog, setScannerMode }) {

                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10"></div>
                    <div className="text-juula-400 mb-4 group-hover:scale-110 transition-transform"><Icons.Camera /></div>
                    <h3 className="text-xl font-black italic mb-2 leading-tight">{txt.scanPlate}</h3>
                    <span className="text-[9px] font-mono bg-juula-500/20 text-juula-400 px-2 py-1 rounded">AI ENGINE</span>
                 </div>
                 
                 <div onClick={() => setScannerMode('barcode')} className="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer active:scale-95 hover:border-juula-500 transition-all shadow-sm group">
                    <div className="text-slate-400 mb-4 group-hover:text-juula-500 transition-colors"><Icons.Barcode /></div>
                    <h3 className="text-xl font-bold mb-2 leading-tight text-slate-800 dark:text-white">{txt.scanBarcode}</h3>
                    <span className="text-[9px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 px-2 py-1 rounded">OPENFOODFACTS</span>

             <div className="grid grid-cols-2 gap-4">
                <div onClick={() => setWater(w => Math.min(w+1, 8))} 
                  className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform text-center relative overflow-hidden">
                    <div className="absolute bottom-0 left-0 right-0 bg-blue-500/10 transition-all duration-500" style={{height: `${(water/8)*100}%`}}></div>
                    <div className={`p-4 rounded-full mb-2 ${water >= 8 ? 'text-blue-500 bg-blue-50 dark:bg-blue-900/20' : 'text-slate-400 bg-slate-50 dark:bg-slate-800'}`}>
                        <Icons.Droplet />
                    </div>
                    <p className="text-3xl font-black text-slate-900 dark:text-white relative z-10">{water}</p>
